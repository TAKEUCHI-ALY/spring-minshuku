<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<div th:replace="~{fragment :: meta}"></div>
	<div th:replace="~{fragment :: styles}"></div>

	<!-- Flatpickr -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

	<title>レビュー</title>
</head>

<body>

	<!-- ヘッダー -->
	<div th:replace="~{fragment :: header}"></div>



	<main>
		<div class="container pt-4 pb-5 samuraitravel-container">
			<div class="row justify-content-center">
				<div class="col-xxl-9 col-xl-10 col-lg-11">
					<!-- パンくずリスト -->
					<nav class="breadcrumb-container mt-3 ms-3 mb-4" style="--bs-breadcrumb-divider: '>';"
						aria-label="breadcrumb">
						<ol class="breadcrumb mb-0">
							<li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
							<li class="breadcrumb-item"><a th:href="@{/houses}">民宿一覧</a></li>
							<li class="breadcrumb-item">
								<a th:href="@{/houses/__${house.id}__}">民宿詳細</a>
							</li>
							<li class="breadcrumb-item active" aria-current="page">レビュー投稿</li>
						</ol>
					</nav>

					<!-- タイトル -->
					<h1 class="mb-4 text-center" th:text="${house != null ? house.name + ' のレビュー投稿' : 'レビュー投稿'}">
					</h1>

					<!-- フォーム -->
					<form method="POST" th:action="@{/houses/__${house.getId()}__/review/create}" th:object="${reviewRegisterForm}">
						
						<!-- ✅ CSRFトークン -->
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						
						<!-- 評価 -->
						<div class="mb-3 d-flex align-items-center justify-content-center">
							<label for="rating" class="form-label me-3 mb-0" style="width: 100px;">評価</label>
							
							<select id="rating" name="rating" class="form-select" style="width: 300px;" required>
								<option value="" disabled selected>評価を選択</option>
								<option value="5">&#9733;&#9733;&#9733;&#9733;&#9733;</option>
								<option value="4">&#9733;&#9733;&#9733;&#9733;&#9734;</option>
								<option value="3">&#9733;&#9733;&#9733;&#9734;&#9734;</option>
								<option value="2">&#9733;&#9733;&#9734;&#9734;&#9734;</option>
								<option value="1">&#9733;&#9734;&#9734;&#9734;&#9734;</option>
							</select>
						</div>

						<!-- コメント -->
						<div class="mb-3 d-flex align-items-start justify-content-center">
							<label for="comment" class="form-label me-3" style="width: 100px;">コメント</label>
							<textarea id="comment" name="comment" class="form-control" rows="4" required
								placeholder="コメントを入力してください" style="max-width: 300px;"></textarea>
						</div>

						<!-- houseId を安全に設定 -->
						<input type="hidden" name="houseId" th:value="${house != null ? house.id : ''}" />

						<!-- 投稿ボタン -->
						<div class="text-center mt-4">
							<button type="submit" class="btn text-white shadow-sm w-25 samuraitravel-btn">
								レビューを投稿
							</button>
						</div>
					</form>

				</div>
			</div>
		</div>
	</main>

	<!-- フッター -->
	<div th:replace="~{fragment :: footer}"></div>

	<!-- スクリプト -->
	<div th:replace="~{fragment :: scripts}"></div>

	<!-- Flatpickr -->
	<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
	<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
	<script th:src="@{/js/flatpickr.js}"></script>

</body>

</html>
